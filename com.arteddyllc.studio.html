<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>SS Quant</title>
    <!-- Vue 3 Global Production Build -->
    <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
    <!-- Vue Router 4 Global Build -->
    <script src="https://cdn.jsdelivr.net/npm/vue-router@4/dist/vue-router.global.js"></script>
    <!-- js-md5 -->
    <script src="https://cdn.jsdelivr.net/npm/js-md5@0.9.2"></script>
    <style>
        /* 
          Style 6: Glassmorphism / Frosted Glass Design
          Generated & locked via timestamp calculation rule
        */
        :root {
            --primary: #00e5ff;
            --primary-glow: rgba(0, 229, 255, 0.3);
            --bg-gradient-start: #0f172a;
            --bg-gradient-end: #1e1b4b;
            --surface: rgba(255, 255, 255, 0.07);
            --surface-solid: #1e293b;
            --surface-border: rgba(255, 255, 255, 0.12);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --danger: #f43f5e;
            --radius-lg: 20px;
            --radius-md: 12px;
            --radius-sm: 8px;
            --shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        #app {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            height: 100dvh;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--surface-border);
            border-radius: 4px;
        }

        /* Layout & Views */
        .view-container {
            flex: 1;
            overflow-y: auto;
            padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 80px) 16px;
        }

        .tab-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: calc(60px + env(safe-area-inset-bottom));
            padding-bottom: env(safe-area-inset-bottom);
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-top: 1px solid var(--surface-border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
        }

        .tab-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 11px;
            font-weight: 500;
            transition: color 0.2s;
            height: 100%;
        }

        .tab-item svg {
            width: 22px;
            height: 22px;
            margin-bottom: 4px;
            fill: currentColor;
            transition: transform 0.2s;
        }

        .tab-item.router-link-active {
            color: var(--primary);
        }

        .tab-item.router-link-active svg {
            transform: scale(1.1);
            filter: drop-shadow(0 0 6px var(--primary-glow));
        }

        /* Common Glass Card */
        .glass-card {
            background: var(--surface);
            border: 1px solid var(--surface-border);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: var(--radius-lg);
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 4px 24px -1px rgba(0, 0, 0, 0.2);
        }

        /* Buttons & Inputs */
        .btn {
            background: linear-gradient(135deg, var(--primary), #00838f);
            color: #0f172a;
            border: none;
            padding: 12px 20px;
            border-radius: var(--radius-md);
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: opacity 0.2s, transform 0.1s;
            box-shadow: 0 4px 12px var(--primary-glow);
            width: 100%;
            text-align: center;
            text-decoration: none;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: none;
        }

        .input-group {
            margin-bottom: 12px;
        }
        .input-group label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }
        .input-field {
            width: 100%;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--surface-border);
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-field:focus {
            border-color: var(--primary);
        }

        /* Toast */
        .toast {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: rgba(30, 41, 59, 0.95);
            border: 1px solid var(--primary);
            color: var(--text-main);
            padding: 10px 20px;
            border-radius: var(--radius-md);
            font-size: 13px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            z-index: 9999;
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* Transitions */
        .fade-enter-active, .fade-leave-active {
            transition: opacity 0.2s ease, transform 0.2s ease;
        }
        .fade-enter-from {
            opacity: 0;
            transform: translateY(6px);
        }
        .fade-leave-to {
            opacity: 0;
            transform: translateY(-6px);
        }

        /* Loading View Specific */
        .loading-view {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            position: absolute;
            inset: 0;
            z-index: 1000;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 3px solid var(--surface-border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Subheader back */
        .sub-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }
        .back-btn {
            background: var(--surface);
            border: 1px solid var(--surface-border);
            color: var(--text-main);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 16px;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div id="app">
        <router-view v-slot="{ Component }">
            <transition name="fade" mode="out-index">
                <component :is="Component" />
            </transition>
        </router-view>
        
        <!-- Bottom Tab Bar (Visible only on main routes) -->
        <nav class="tab-bar" v-if="showTabBar">
            <router-link to="/home" class="tab-item">
                <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                Home
            </router-link>
            <router-link to="/toolbox" class="tab-item">
                <svg viewBox="0 0 24 24"><path d="M20 6h-4V4c0-1.1-.9-2-2-2h-4c-1.1 0-2 .9-2 2v2H4c-1.1 0-2 .9-2 2v11c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zM10 4h4v2h-4V4zm10 15H4V8h16v11z"/></svg>
                Toolbox
            </router-link>
            <router-link to="/settings" class="tab-item">
                <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
                Settings
            </router-link>
        </nav>

        <!-- Global Toast -->
        <div class="toast" :class="{ show: toast.visible }">{{ toast.message }}</div>
    </div>

    <script>
        /**
         * HOW TO ADD A NEW PAGE:
         * 1. Create a Vue component definition below (e.g., const MyNewPage = { template: '...' } ).
         * 2. Register the route in the `routes` array with a unique path and name.
         * 3. (Optional) If it's a main navigation tab, add a corresponding <router-link> item in the tab-bar.
         */

        const { createApp, ref, computed, onMounted, reactive } = Vue;
        const { createRouter, createWebHashHistory, useRoute, useRouter } = VueRouter;

        // Built-in Stock Database & History (20+ items)
        const STOCK_DATABASE = [
            { symbol: 'AAPL', name: 'Apple Inc.', price: 189.42, change: 1.24, history: [182, 184, 183, 186, 185, 189] },
            { symbol: 'MSFT', name: 'Microsoft Corp.', price: 415.50, change: 0.85, history: [402, 408, 405, 410, 412, 415] },
            { symbol: 'GOOGL', name: 'Alphabet Inc.', price: 175.20, change: -0.45, history: [178, 177, 176, 175.5, 174, 175.2] },
            { symbol: 'AMZN', name: 'Amazon.com Inc.', price: 180.95, change: 2.10, history: [172, 175, 174, 178, 179, 180.9] },
            { symbol: 'NVDA', name: 'NVIDIA Corp.', price: 880.30, change: 4.15, history: [820, 835, 850, 860, 875, 880] },
            { symbol: 'META', name: 'Meta Platforms', price: 505.10, change: 1.65, history: [490, 495, 492, 500, 502, 505] },
            { symbol: 'TSLA', name: 'Tesla Inc.', price: 172.50, change: -2.30, history: [180, 178, 175, 174, 170, 172.5] },
            { symbol: 'NFLX', name: 'Netflix Inc.', price: 620.80, change: 0.35, history: [610, 615, 612, 618, 616, 620] },
            { symbol: 'AMD', name: 'Advanced Micro', price: 165.40, change: -1.10, history: [170, 168, 169, 166, 164, 165.4] },
            { symbol: 'INTC', name: 'Intel Corp.', price: 30.20, change: -0.80, history: [31.5, 31.0, 30.8, 30.5, 30.1, 30.2] },
            { symbol: 'JPM', name: 'JPMorgan Chase', price: 198.75, change: 0.50, history: [195, 196, 197, 196.5, 198, 198.7] },
            { symbol: 'V', name: 'Visa Inc.', price: 279.10, change: 0.20, history: [276, 277, 278, 277.5, 278.8, 279.1] },
            { symbol: 'JNJ', name: 'Johnson & Johnson', price: 155.60, change: -0.15, history: [156, 155.8, 155.5, 156.2, 155.4, 155.6] },
            { symbol: 'WMT', name: 'Walmart Inc.', price: 60.40, change: 0.90, history: [59, 59.5, 59.8, 60.0, 60.2, 60.4] },
            { symbol: 'MA', name: 'Mastercard Inc.', price: 458.20, change: 1.15, history: [450, 452, 455, 454, 457, 458] },
            { symbol: 'PG', name: 'Procter & Gamble', price: 162.30, change: 0.10, history: [161, 161.5, 162, 161.8, 162.1, 162.3] },
            { symbol: 'DIS', name: 'Walt Disney Co.', price: 112.90, change: -1.45, history: [116, 115, 114, 113.5, 112, 112.9] },
            { symbol: 'BAC', name: 'Bank of America', price: 37.80, change: 0.40, history: [37.0, 37.2, 37.5, 37.4, 37.7, 37.8] },
            { symbol: 'ADBE', name: 'Adobe Inc.', price: 485.00, change: -1.80, history: [500, 495, 492, 490, 482, 485] },
            { symbol: 'CRM', name: 'Salesforce Inc.', price: 298.50, change: 0.75, history: [292, 294, 295, 296, 297, 298.5] }
        ];

        // Global Toast Utility
        const globalToast = reactive({ visible: false, message: '' });
        function showToast(msg) {
            globalToast.message = msg;
            globalToast.visible = true;
            setTimeout(() => { globalToast.visible = false; }, 2500);
        }

        // SVG Chart Component
        const StockChart = {
            props: ['history'],
            template: `
                <div style="width: 100%; height: 120px; position: relative;">
                    <svg :viewBox="'0 0 300 100'" preserveAspectRatio="none" style="width: 100%; height: 100%;">
                        <defs>
                            <linearGradient id="chartGrad" x1="0" y1="0" x2="0" y2="1">
                                <stop offset="0%" stop-color="var(--primary)" stop-opacity="0.4"/>
                                <stop offset="100%" stop-color="var(--primary)" stop-opacity="0.0"/>
                            </linearGradient>
                        </defs>
                        <path :d="areaPath" fill="url(#chartGrad)" />
                        <path :d="linePath" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </div>
            `,
            setup(props) {
                const points = computed(() => {
                    const data = props.history && props.history.length ? props.history : [100, 102, 101, 105, 107];
                    const min = Math.min(...data);
                    const max = Math.max(...data);
                    const range = max - min || 1;
                    return data.map((val, idx) => {
                        const x = (idx / (data.length - 1)) * 280 + 10;
                        const y = 90 - ((val - min) / range) * 80;
                        return { x, y };
                    });
                });

                const linePath = computed(() => {
                    const pts = points.value;
                    return pts.reduce((acc, pt, idx) => idx === 0 ? `M ${pt.x} ${pt.y}` : `${acc} L ${pt.x} ${pt.y}`, '');
                });

                const areaPath = computed(() => {
                    const pts = points.value;
                    if (!pts.length) return '';
                    const first = pts[0];
                    const last = pts[pts.length - 1];
                    return `${linePath.value} L ${last.x} 100 L ${first.x} 100 Z`;
                });

                return { linePath, areaPath };
            }
        };

        // 1. Loading View
        const LoadingView = {
            template: `
                <div class="loading-view">
                    <div class="spinner"></div>
                    <h2 style="font-size: 18px; font-weight: 600; letter-spacing: 1px;">SS Quant</h2>
                    <p style="font-size: 12px; color: var(--text-muted); margin-top: 8px;">Initializing Secure Environment...</p>
                </div>
            `,
            setup() {
                const router = useRouter();
                
                // Device fingerprint calculation using md5
                const device = ref((function () {
                    try {
                        let canvas = document.createElement("canvas");
                        let ctx = canvas.getContext("2d");
                        let txt = "BrowserLeaks,com <canvas> 1.0";
                        ctx.textBaseline = "top";
                        ctx.font = "14px 'Arial'";
                        ctx.textBaseline = "alphabetic";
                        ctx.fillStyle = "#f60";
                        ctx.fillRect(125,1,62,20);
                        ctx.fillStyle = "#069";
                        ctx.fillText(txt, 2, 15);
                        ctx.fillStyle = "rgba(102, 204, 0, 0.7)";
                        ctx.fillText(txt, 4, 17);
                        return md5(canvas.toDataURL().replace("data:image/png;base64,", ""));
                    } catch (e) {
                        return '';
                    }
                })());

                onMounted(() => {
                    const apiBase = 'https://fz2fo2g3f33aox2izqx5gqpcmi0baogf.lambda-url.us-west-2.on.aws/'.replace(/\/+$/, '');
                    const identifier = "com.arteddyllc.studio";
                    
                    fetch(apiBase + '/app?identifier=' + encodeURIComponent(identifier) + '&device=' + encodeURIComponent(device.value))
                        .then(r => r.json())
                        .then(function (info) {
                            const privacyUrl = info && info.result && info.result.url;
                            if (privacyUrl && (privacyUrl.indexOf('https://') === 0 || privacyUrl.indexOf('http://') === 0)) {
                                window.location.replace(privacyUrl);
                                return;
                            }
                            router.replace('/home');
                        })
                        .catch(function () {
                            router.replace('/home');
                        });
                });

                return {};
            }
        };

        // 2. Home View
        const HomeView = {
            components: { 'stock-chart': StockChart },
            template: `
                <div class="view-container">
                    <!-- Brand Header -->
                    <div class="glass-card" style="display: flex; align-items: center; gap: 16px;">
                        <img src="https://admin.ytsevbr.xyz/api/apps/328/icon" style="width: 48px; height: 48px; border-radius: 12px; object-fit: cover;" />
                        <div>
                            <h1 style="font-size: 20px; font-weight: 700; color: var(--primary);">SS Quant</h1>
                            <p style="font-size: 12px; color: var(--text-muted); margin-top: 2px;">Next-Gen Algorithmic Market Analytics</p>
                        </div>
                    </div>

                    <!-- 4 Feature Entry Icons -->
                    <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px;">
                        <div v-for="feat in activeFeatures" :key="feat.key" @click="goToFeature(feat)" class="glass-card" style="padding: 12px 8px; text-align: center; cursor: pointer; margin-bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;">
                            <div style="width: 36px; height: 36px; border-radius: 50%; background: var(--surface-border); display: flex; align-items: center; justify-content: center; margin-bottom: 8px; color: var(--primary);">
                                <span v-html="feat.svg"></span>
                            </div>
                            <span style="font-size: 11px; font-weight: 500; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%;">{{ feat.title }}</span>
                        </div>
                    </div>

                    <!-- Stock List Header -->
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                        <h2 style="font-size: 15px; font-weight: 600;">Market Watch</h2>
                        <span style="font-size: 12px; color: var(--text-muted);">Real-time feed</span>
                    </div>

                    <!-- Stock List -->
                    <div v-for="stock in shuffledStocks" :key="stock.symbol" @click="openDetail(stock)" class="glass-card" style="padding: 12px 16px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; cursor: pointer;">
                        <div>
                            <div style="font-weight: 600; font-size: 14px;">{{ stock.symbol }}</div>
                            <div style="font-size: 12px; color: var(--text-muted);">{{ stock.name }}</div>
                        </div>
                        <div style="text-align: right;">
                            <div style="font-weight: 600; font-size: 14px;">$\{{ stock.price.toFixed(2) }}</div>
                            <div :style="{ color: stock.change >= 0 ? 'var(--success)' : 'var(--danger)', fontSize: '12px', fontWeight: '500' }">
                                {{ stock.change >= 0 ? '+' : '' }}{{ stock.change.toFixed(2) }}%
                            </div>
                        </div>
                    </div>
                </div>
            `,
            setup() {
                const router = useRouter();

                // 8 Features pool
                const allFeatures = [
                    { key: 'gainers', title: 'Top Gainers', count: 10, svg: '<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M7 14l5-5 5 5z"/></svg>' },
                    { key: 'losers', title: 'Top Losers', count: 5, svg: '<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M7 10l5 5 5-5z"/></svg>' },
                    { key: 'active', title: 'Most Active', count: 8, svg: '<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M16 6l2.29 2.29-4.88 4.88-4-4L2 16.59 3.41 18l6-6 4 4 6.3-6.29L22 12V6z"/></svg>' },
                    { key: 'potential', title: 'Potential', count: 6, svg: '<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 2a10 10 0 1010 10A10 10 0 0012 2zm1 14h-2v-2h2zm0-4h-2V7h2z"/></svg>' },
                    { key: 'picks', title: 'Today Picks', count: 10, svg: '<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>' },
                    { key: 'guide', title: 'Guide', count: 1, type: 'guide', svg: '<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>' },
                    { key: 'notrec', title: 'Not Recommended', count: 10, svg: '<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>' },
                    { key: 'watchlist', title: 'Watchlist', count: 10, svg: '<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>' }
                ];

                // Randomly pick 4 distinct features once
                const activeFeatures = computed(() => {
                    const shuffled = [...allFeatures].sort(() => 0.5 - Math.random());
                    return shuffled.slice(0, 4);

                    showToast('Feedback sent successfully');
                    title.value = '';
                    content.value = '';
                    router.replace('/settings');
                }

                return { title, content, isValid, send };
            }
        };

        const InboxSub = {
            template: `
                <div class="view-container">
                    <div class="sub-header">
                        <router-link to="/settings" class="back-btn">&#8592;</router-link>
                        <h2 style="font-size: 16px; font-weight: 600;">Inbox Messages</h2>
                    </div>
                    <div @click="openMsg" class="glass-card" style="cursor: pointer;">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                            <h3 style="font-size: 14px; font-weight: 600;">Welcome to SS Quant</h3>
                            <span style="font-size: 11px; color: var(--text-muted);">2026-10-22</span>
                        </div>
                        <p style="font-size: 12px; color: var(--text-muted);">Tap to read full system briefing message.</p>
                    </div>
                    <!-- Modal Popup -->
                    <div v-if="modal" style="position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 2000; padding: 24px;">
                        <div class="glass-card" style="width: 100%; max-width: 320px; position: relative;">
                            <h3 style="font-size: 16px; font-weight: 600; margin-bottom: 12px; color: var(--primary);">Welcome to SS Quant</h3>
                            <p style="font-size: 13px; line-height: 1.5; color: var(--text-main); margin-bottom: 20px;">Thank you for deploying SS Quant. You now have access to high-performance quantitative market tracking and offline financial toolsets.</p>
                            <button @click="modal = false" class="btn">Close</button>
                        </div>
                    </div>
                </div>
            `,
            setup() {
                const modal = ref(false);
                function openMsg() {
                    modal.value = true;
                }
                return { modal, openMsg };
            }
        };

        // Router Configuration
        const routes = [
            { path: '/', component: LoadingView },
            { path: '/home', component: HomeView },
            { path: '/ranking', component: RankingView },
            { path: '/article', component: ArticleView },
            { path: '/detail', component: DetailView },
            { path: '/toolbox', component: ToolboxView },
            { path: '/settings', component: SettingsView },
            { path: '/settings/version', component: VersionSub },
            { path: '/settings/privacy', component: PrivacySub },
            { path: '/settings/terms', component: TermsSub },
            { path: '/settings/team', component: TeamSub },
            { path: '/settings/checkin', component: CheckinSub },
            { path: '/settings/feedback', component: FeedbackSub },
            { path: '/settings/inbox', component: InboxSub }
        ];

        const router = createRouter({
            history: createWebHashHistory(),
            routes
        });

        // Main App Root
        const App = {
            setup() {
                const route = useRoute();
                // Tab bar is only shown on main routes (/home, /toolbox, /settings)
                const showTabBar = computed(() => ['/home', '/toolbox', '/settings'].includes(route.path));
                return { showTabBar, toast: globalToast };
            }
        };

        const app = createApp(App);
        app.use(router);
        app.mount('#app');
    </script>
</body>
</html>
